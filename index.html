<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EP-03 // Everton Park 3-Room HDB Monitor</title>
  <!-- Load Inter & JetBrains Mono for authentic Braun / Neo-Grotesque typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-chassis: #F4F3EF;
      --bg-module: #EAE8E1;
      --bg-surface: #FFFFFF;
      --bg-baseline: #FBF9F5;
      --ink-primary: #1A1A1A;
      --ink-secondary: #5A5852;
      --ink-muted: #8C8980;
      --rule-color: #D2CFC6;
      --rule-dark: #1A1A1A;
      --braun-orange: #FF5500;
      --braun-green: #2E6F40;
      --braun-green-bg: #EBF4EE;
      --braun-orange-bg: #FFF0E8;
      --braun-amber: #C87D12;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    /* BRAUN T1000 / ATELIER ANTHRACITE DARK MODE */
    [data-theme="dark"] {
      --bg-chassis: #181817;
      --bg-module: #222220;
      --bg-surface: #2A2A27;
      --bg-baseline: #33322E;
      --ink-primary: #F0EFEA;
      --ink-secondary: #B5B2A8;
      --ink-muted: #7E7B72;
      --rule-color: #3D3C38;
      --rule-dark: #F0EFEA;
      --braun-orange: #FF5500;
      --braun-green: #4CC36E;
      --braun-green-bg: #1D3524;
      --braun-orange-bg: #3B2014;
      --braun-amber: #E59A2E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-chassis);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .chassis {
      max-width: 1180px;
      margin: 0 auto;
      background-color: var(--bg-chassis);
      border: 2px solid var(--rule-dark);
      padding: 24px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    /* HEADER BAR */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--rule-dark);
      padding-bottom: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .orange-led {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: var(--braun-orange);
      border: 1.5px solid var(--rule-dark);
      flex-shrink: 0;
    }

    .system-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .system-subtitle {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 3px;
    }

    .spec-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .spec-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      background-color: var(--bg-module);
      border: 1px solid var(--rule-dark);
      text-transform: uppercase;
    }

    .spec-badge.highlight {
      background-color: var(--ink-primary);
      color: var(--bg-chassis);
    }

    /* SECTION HEADINGS */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1.5px solid var(--rule-dark);
      border-bottom: 1px solid var(--rule-color);
      padding: 10px 0;
      margin-top: 24px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-code {
      background-color: var(--ink-primary);
      color: var(--bg-chassis);
      padding: 2px 6px;
      font-size: 10px;
    }

    /* TELEMETRY GRID */
    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .telemetry-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--rule-dark);
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .telemetry-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    /* NON-TEXT BRAUN GEOMETRIC HARDWARE SYMBOLS */
    .braun-glyph {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--ink-primary);
    }

    .glyph-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: currentColor;
      display: inline-block;
    }

    .glyph-dot.orange {
      background-color: var(--braun-orange);
    }

    .glyph-ring {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      display: inline-block;
    }

    .glyph-square {
      width: 7px;
      height: 7px;
      background-color: currentColor;
      display: inline-block;
    }

    .glyph-bar {
      width: 12px;
      height: 2px;
      background-color: currentColor;
      display: inline-block;
    }

    .telemetry-value {
      font-family: var(--font-mono);
      font-size: 19px;
      font-weight: 700;
      color: var(--ink-primary);
      margin-bottom: 6px;
    }

    .telemetry-sub {
      font-size: 12px;
      color: var(--ink-secondary);
      margin-bottom: 10px;
    }

    .signal-pill {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border: 1px solid currentColor;
      width: fit-content;
    }

    .signal-up {
      color: var(--braun-green);
      background-color: var(--braun-green-bg);
    }

    .signal-down {
      color: var(--braun-orange);
      background-color: var(--braun-orange-bg);
    }

    .signal-neutral {
      color: var(--ink-secondary);
      background-color: var(--bg-module);
    }

    /* TREND LINE GRAPH PANEL */
    .trend-panel {
      background-color: var(--bg-surface);
      border: 1px solid var(--rule-dark);
      padding: 16px;
      margin-bottom: 20px;
    }

    .trend-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .graph-container {
      width: 100%;
      overflow-x: auto;
    }

    .braun-svg-graph {
      width: 100%;
      min-width: 580px;
      height: 215px;
      display: block;
    }

    .graph-grid-line {
      stroke: var(--rule-color);
      stroke-width: 1;
      stroke-dasharray: 3 3;
    }

    .graph-axis-line {
      stroke: var(--rule-dark);
      stroke-width: 1.5;
    }

    .graph-trend-line {
      fill: none;
      stroke: var(--ink-primary);
      stroke-width: 2.5;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .graph-trend-area {
      fill: var(--braun-orange);
      opacity: 0.08;
    }

    .graph-node {
      fill: var(--bg-surface);
      stroke: var(--ink-primary);
      stroke-width: 2.5;
    }

    .graph-node.active {
      fill: var(--braun-orange);
      stroke: var(--rule-dark);
    }

    .graph-label-psf {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      fill: var(--ink-primary);
      text-anchor: middle;
    }

    .graph-label-yoy {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      text-anchor: middle;
    }

    .graph-label-yoy.up {
      fill: var(--braun-green);
    }

    .graph-label-yoy.down {
      fill: var(--braun-orange);
    }
